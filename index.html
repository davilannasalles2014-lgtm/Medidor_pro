<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Medidor Pro</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#0b1020;color:white;padding:15px}
.app{max-width:760px;margin:auto}
h1{margin:5px 0}
p{color:#bbb}
.card{background:#18213a;border-radius:16px;padding:15px;margin:12px 0}
.camera{position:relative;background:#000;border-radius:12px;overflow:hidden}
video{width:100%;display:block}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
button,input,select{width:100%;padding:13px;margin:6px 0;border:0;border-radius:10px;font-size:16px}
button{background:#1976d2;color:white;font-weight:bold}
button:disabled{opacity:.5}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.result{font-size:28px;text-align:center;padding:18px;background:#0b1020;border-radius:12px}
.ok{color:#5cff9d}
.small{font-size:14px;color:#aaa}
</style>
</head>
<body>
<div class="app">

<h1>📏 Medidor Pro</h1>
<p>Meça objetos usando a câmera do celular.</p>

<div class="card">
<div class="camera">
<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>
</div>

<div class="grid">
<button id="start">📷 Abrir câmera</button>
<button id="stop">⏹ Parar</button>
</div>
</div>

<div class="card">
<h2>1️⃣ Calibração</h2>
<p>Coloque uma régua na câmera e informe o tamanho conhecido.</p>

<input id="ref" type="number" placeholder="Tamanho da régua em mm">

<button id="calibrate">📐 Calibrar</button>

<p id="status">Toque em dois pontos da régua.</p>
</div>

<div class="card">
<h2>2️⃣ Medir</h2>

<button id="measure">📏 Medir objeto</button>

<div class="result" id="result">0,00 mm</div>

<p class="small">
Depois de calibrar, toque em dois pontos do objeto para medir.
</p>
</div>

</div>

<script>
const video=document.getElementById("video");
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const start=document.getElementById("start");
const stop=document.getElementById("stop");
const ref=document.getElementById("ref");
const calibrate=document.getElementById("calibrate");
const measure=document.getElementById("measure");
const status=document.getElementById("status");
const result=document.getElementById("result");

let stream=null;
let points=[];
let scale=null;
let mode="calibrate";

start.onclick=async()=>{
try{
stream=await navigator.mediaDevices.getUserMedia({
video:{facingMode:"environment"},
audio:false
});
video.srcObject=stream;
start.disabled=true;
stop.disabled=false;
status.textContent="Câmera aberta. Coloque a régua.";
resizeCanvas();
}catch(e){
alert("Não foi possível abrir a câmera.");
}
};

stop.onclick=()=>{
if(stream){
stream.getTracks().forEach(t=>t.stop());
stream=null;
video.srcObject=null;
}
start.disabled=false;
points=[];
clearCanvas();
};

video.onloadedmetadata=resizeCanvas;
window.onresize=resizeCanvas;

function resizeCanvas(){
if(video.videoWidth){
canvas.width=video.videoWidth;
canvas.height=video.videoHeight;
draw();
}
}

function clearCanvas(){
ctx.clearRect(0,0,canvas.width,canvas.height);
}

function distance(a,b){
return Math.hypot(b.x-a.x,b.y-a.y);
}

function draw(){
clearCanvas();

if(points.length>0){
ctx.fillStyle="red";
points.forEach(p=>{
ctx.beginPath();
ctx.arc(p.x,p.y,12,0,Math.PI*2);
ctx.fill();
});
}

if(points.length===2){
ctx.strokeStyle="red";
ctx.lineWidth=5;
ctx.beginPath();
ctx.moveTo(points[0].x,points[0].y);
ctx.lineTo(points[1].x,points[1].y);
ctx.stroke();
}
}

canvas.addEventListener("pointerdown",e=>{
if(!video.videoWidth)return;

const r=canvas.getBoundingClientRect();

const x=(e.clientX-r.left)*canvas.width/r.width;
const y=(e.clientY-r.top)*canvas.height/r.height;

if(points.length>=2)points=[];

points.push({x,y});
draw();

if(points.length===2){
const px=distance(points[0],points[1]);

if(mode==="calibrate"){
const mm=parseFloat(ref.value);

if(!mm||mm<=0){
alert("Informe primeiro o tamanho conhecido em mm.");
points=[];
draw();
return;
}

scale=mm/px;

status.innerHTML=
"✅ Calibrado: "+scale.toFixed(4)+" mm por pixel";

mode="measure";
}else{
if(!scale){
alert("Calibre primeiro.");
return;
}

const mm=px*scale;

result.textContent=mm.toFixed(2)+" mm";
status.textContent="✅ Medição concluída";
}

points=[];
draw();
}
});

calibrate.onclick=()=>{
mode="calibrate";
points=[];
result.textContent="0,00 mm";
status.textContent="Agora toque nos dois pontos da régua.";
draw();
};

measure.onclick=()=>{
if(!scale){
alert("Primeiro faça a calibração com uma régua.");
return;
}

mode="measure";
points=[];
status.textContent="Agora toque nos dois pontos do objeto.";
draw();
};
</script>

</body>
</html>
